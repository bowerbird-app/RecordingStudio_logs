oped.map(&:name), dry_run: dry_run","        )","      end","","      def dormant_consumer?","        consumers.any?(&:dormant?)","      end","","      def counted","        rooted_logs.map { |log| row_count(log.table_name, log.root_column) } + summary_counts","      end","","      def summary_counts","        scoped.filter_map { |definition| summary_count(definition) }","      end","","      def summary_count(definition)","        return unless summary_table?(definition)","","        row_count(definition.summary_model.table_name, definition.log.root_column)","      end","","      def delete_and_rebuild(times)","        removed = remove_matching","        rebuild(times)","        removed","      end","","      def remove_matching","        rooted_logs.map { |log| removed_count(log.table_name, log.root_column) } + removed_summaries","      end","","      def removed_summaries","        scoped.filter_map { |definition| remove_summary(definition) }","      end","","      def remove_summary(definition)","        return unless summary_table?(definition)","","        removed_count(definition.summary_model.table_name, definition.log.root_column)","      end","","      def rebuild(times)","        unscoped.each do |definition|","          times.map { |time| definition.period.start_for(time) }.uniq.each do |start|","            Aggregation::Runner.call(definition, period_start: start, connection: connection)","          end","        end","      end","","      def row_count(table_name, column)","        { table: table_name, rows: count_rows(table_name, column) }","      end","","      def removed_count(table_name, column)","        { table: table_name, rows: remove_rows(table_name, column) }","      end","","      def summary_table?(definition)","        definition.summary_model&.table_exists?","      end","","      def rooted_logs","        RecordingStudioLogs.registry.logs.select { |log| log.loaded? && log.root_column }","      end","","      def consumers","        rooted
